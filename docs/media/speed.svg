<text x="32" y="422" class="s">The card holds part of the experts, the CPU computes the rest.</text>
<text x="32" y="444" class="s">Flint: UD-Q3_K_XL, the size setup takes with 32 GB of RAM.</text>
<text x="32" y="466" class="s">GLM, DeepSeek and Kolibri 1 need more than 32 GB of RAM.</text>
<text x="32" y="488" class="s">Clover was not measured on the workstation.</text>

