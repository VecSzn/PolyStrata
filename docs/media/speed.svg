<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-label="Writing speed in tokens per second. Laptop with an 8 GB card: LFM2.5-24B-A2B 70 to 73, Qwen3.6-35B-A3B 94 to 100, Gemma 4 26B-A4B 92 to 93, Ornith 1.5 76 to 82, Tiel Coder 35B-A3B 83, MiniCPM-V 4.7 64, Flint 40B-A2.5B 61 to 63 (UD-Q3_K_XL, the size setup takes there), Clover-35B-A3B-Preview 68 to 73. Workstation with a 32 GB card: LFM2.5-24B-A2B 480 to 485, Qwen3.6-35B-A3B 394 to 395, Gemma 4 26B-A4B 353 to 356, Ornith 1.5 316 to 319, Tiel Coder 35B-A3B 337 to 345, MiniCPM-V 4.7 308 to 311, GLM 5.3 Flash 59 to 66, DeepSeek V4 Flash 56, Flint 40B-A2.5B 251 to 252, Kolibri 1 189 to 192 (Q2_K). GLM, DeepSeek and Kolibri 1 need more than the laptop's 32 GB of RAM; Clover was not measured on the workstation."><title>Writing speed of the eleven added models, tokens per second</title>
